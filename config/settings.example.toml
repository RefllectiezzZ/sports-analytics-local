# Example application settings for sports-analytics-local.
# Copy and adjust locally. Do not store credentials or secrets here.

[application]
name = "sports-analytics-local"
environment = "development"
timezone = "UTC"
deterministic_seed = 42

[storage]
root_directory = "storage"
sqlite_path = "storage/operational.sqlite3"
raw_directory = "storage/raw"
snapshots_directory = "storage/snapshots"
features_directory = "storage/features"
models_directory = "storage/models"
exports_directory = "storage/exports"
logs_directory = "storage/logs"

[logging]
level = "INFO"
format = "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
date_format = "%Y-%m-%dT%H:%M:%SZ"
file_enabled = true
file_name = "sports-analytics.log"
max_bytes = 1048576
backup_count = 5

[worker]
poll_interval_seconds = 30
heartbeat_interval_seconds = 15
stale_job_timeout_seconds = 300
retry_backoff_base_seconds = 5
retry_backoff_max_seconds = 300
shutdown_grace_seconds = 30
recovery_batch_size = 100

[scraping]
enabled = false
request_timeout_seconds = 30
maximum_retries = 3
browser_headless = true
retry_backoff_base_seconds = 2
retry_backoff_max_seconds = 30
minimum_request_interval_seconds = 2
maximum_download_bytes = 26214400

[modelling]
enabled = false
default_random_seed = 42
minimum_training_samples = 100

[bookmakers]
enabled = false
preferred_provider = "betano-pt"
comparison_provider = "betclic-pt"
selection_mode = "preferred-unless-better"
browser_mode = "headless"
quote_maximum_age_seconds = 300
default_window_hours = 48
maximum_window_hours = 168
maximum_events_per_sport = 100
market_depth = "all-observed-markets"
maximum_response_bytes = 2097152
maximum_total_capture_bytes = 16777216
event_detail_concurrency = 1
minimum_event_detail_interval_ms = 1000
navigation_timeout_ms = 30000
explicit_retry_limit = 0

[bookmakers.betano]
enabled = true
acquisition_interval_seconds = 300
initial_delay_seconds = 30
blocked_cooldown_seconds = 900

[bookmakers.betclic]
enabled = true
acquisition_interval_seconds = 300
initial_delay_seconds = 45
blocked_cooldown_seconds = 900
