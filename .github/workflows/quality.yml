name: Windows Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  windows-compatibility:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run pytest
        run: python -m pytest

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Verify Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy src

      - name: Build local v1 wheel
        run: python -m pip wheel . --no-deps --wheel-dir storage/release-wheel-validation

      - name: Smoke installed local v1 wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem storage/release-wheel-validation/*.whl | Select-Object -First 1).FullName
          python -m venv --system-site-packages storage/wheel-smoke-venv
          storage/wheel-smoke-venv/Scripts/python.exe -m pip install --no-deps $wheel
          storage/wheel-smoke-venv/Scripts/sports-analytics-v1.exe --version
          storage/wheel-smoke-venv/Scripts/sports-analytics-v1.exe --help
          storage/wheel-smoke-venv/Scripts/python.exe -c "import sports_analytics; assert sports_analytics.__version__ == '1.0.0'"
